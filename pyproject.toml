[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecode"
version = "1.0.0"
description = "🧠 基于 LangGraph 的 AI 编程助手。用自然语言操作项目文件系统——读取、搜索、编辑文件，执行命令，Git 集成，支持 SSE 流式响应和 CLI 终端交互。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # Backend
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-mysql",
    "pymysql",
    "pydantic",
    "python-dotenv",
    # CLI
    "rich",
    "pyyaml",
    "prompt_toolkit>=3.0",
]

[project.scripts]
ecode = "cli.chat:main"

[tool.setuptools.packages.find]
include = ["cli*", "tools*", "memory*", "hooks*", "permissions*", "tasks*", "utils*", "context*"]

[tool.setuptools]
py-modules = ["agent", "model", "session", "schemas", "settings", "context_manager", "project_context"]
